name: Benchmark CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BENCH_JOBS: 2

jobs:
  benchmark-cjson:
    name: cJSON benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Verify tools
        run: |
          ninja --version
          cmake --version
          cc --version | head -1
          git --version
          /usr/bin/time --version | head -1
      - name: Prepare benchmark harness
        run: cp -R .github/ci/benchmarks benchmarks
      - name: Benchmark cJSON
        run: |
          set -o pipefail
          python3 benchmarks/cjson/benchmark.py | tee cjson-benchmark.log
      - name: Render readable benchmark table
        run: |
          mkdir -p benchmark-artifact
          python3 .github/ci/table_svg.py benchmarks/cjson/README.md benchmark-artifact cjson
          cp benchmarks/cjson/results.json benchmark-artifact/results.json
          cp cjson-benchmark.log benchmark-artifact/benchmark.log
      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-cjson
          path: benchmark-artifact/
          if-no-files-found: error
          retention-days: 30

  benchmark-fanout:
    name: libcurl fan-out benchmark
    needs: benchmark-cjson
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Verify tools
        run: |
          ninja --version
          cmake --version
          cc --version | head -1
          git --version
          /usr/bin/time --version | head -1
      - name: Prepare benchmark harness
        run: cp -R .github/ci/benchmarks benchmarks
      - name: Benchmark libcurl header fan-out
        run: |
          set -o pipefail
          python3 benchmarks/fanout/benchmark.py | tee fanout-benchmark.log
      - name: Render readable benchmark table
        run: |
          mkdir -p benchmark-artifact
          python3 .github/ci/table_svg.py benchmarks/fanout/README.md benchmark-artifact fanout
          cp benchmarks/fanout/results.json benchmark-artifact/results.json
          cp fanout-benchmark.log benchmark-artifact/benchmark.log
      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-fanout
          path: benchmark-artifact/
          if-no-files-found: error
          retention-days: 30

  benchmark-sdl3:
    name: SDL3 benchmark
    needs: benchmark-fanout
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Verify tools
        run: |
          ninja --version
          cmake --version
          cc --version | head -1
          git --version
          /usr/bin/time --version | head -1
      - name: Machine
        run: |
          uname -a
          lscpu | sed -n '1,20p'
          cc --version | head -1
          cmake --version | head -1
          ninja --version
      - name: Prepare benchmark harness
        run: cp -R .github/ci/benchmarks benchmarks
      - name: Benchmark and profile SDL3
        run: |
          mkdir -p benchmark-report
          set -o pipefail
          python3 benchmarks/sdl3/benchmark.py | tee benchmark-report/benchmark.log
      - name: Build SDL3 report
        run: |
          python3 benchmarks/sdl3/render_report.py benchmark-report/benchmark.log benchmark-report
          mkdir -p benchmark-artifact
          python3 .github/ci/table_svg.py benchmark-report/summary.md benchmark-artifact sdl3
          cp benchmark-report/results.json benchmark-artifact/results.json
          cp benchmark-report/benchmark.log benchmark-artifact/benchmark.log
          cp benchmark-report/timings.svg benchmark-artifact/sdl3-timings.svg
          cp benchmark-report/resources.svg benchmark-artifact/sdl3-resources.svg
          {
            echo
            echo '## Additional charts'
            echo
            echo '![SDL3 timings](sdl3-timings.svg)'
            echo
            echo '![SDL3 resources](sdl3-resources.svg)'
          } >> benchmark-artifact/summary.md
      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-sdl3
          path: benchmark-artifact/
          if-no-files-found: error
          retention-days: 30

  benchmark-large:
    name: Wireshark benchmark
    needs: benchmark-sdl3
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Wireshark benchmark dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            ninja-build cmake build-essential git time flex bison perl python3 \
            libglib2.0-dev libgcrypt20-dev libc-ares-dev libpcre2-dev
      - name: Prepare benchmark harness
        run: cp -R .github/ci/benchmarks benchmarks
      - name: Benchmark Wireshark dissectors
        run: |
          set -o pipefail
          python3 benchmarks/large/benchmark.py | tee large-benchmark.log
      - name: Render readable benchmark table
        run: |
          mkdir -p benchmark-artifact
          python3 .github/ci/table_svg.py benchmarks/large/README.md benchmark-artifact wireshark
          cp benchmarks/large/results.json benchmark-artifact/results.json
          cp large-benchmark.log benchmark-artifact/benchmark.log
      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-large
          path: benchmark-artifact/
          if-no-files-found: error
          retention-days: 30

  benchmark-release:
    name: Benchmark summary + release
    needs:
      - benchmark-cjson
      - benchmark-fanout
      - benchmark-sdl3
      - benchmark-large
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-*
          path: benchmark-release-data
          merge-multiple: false

      - name: Build release bundle and notes
        run: |
          set -euo pipefail
          mkdir -p release-assets

          generated="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          {
            echo '# C-BuildSystem benchmark results'
            echo
            echo 'Manual benchmark run with the standardized C-BuildSystem benchmark suite.'
            echo
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Workflow run | [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo "| Run ID | \`${GITHUB_RUN_ID}\` |"
            echo "| BENCH_JOBS | \`${BENCH_JOBS}\` |"
            echo "| Generated | ${generated} |"
            echo
            echo 'Benchmarks run sequentially: cJSON → libcurl fan-out → SDL3 → Wireshark.'
            echo
            echo 'Release assets include raw JSON results, benchmark logs, readable Markdown summaries, SVG tables/charts, complete per-benchmark archives, and one combined archive.'
          } > benchmark-summary.md

          for dir in benchmark-release-data/benchmark-*; do
            [ -d "$dir" ] || continue
            name="${dir##*/benchmark-}"

            if [ -s "$dir/summary.md" ]; then
              {
                echo
                echo "## ${name}"
                echo
                cat "$dir/summary.md"
              } >> benchmark-summary.md
            fi

            [ ! -f "$dir/results.json" ] || cp "$dir/results.json" "release-assets/${name}-results.json"
            [ ! -f "$dir/benchmark.log" ] || cp "$dir/benchmark.log" "release-assets/${name}-benchmark.log"
            [ ! -f "$dir/summary.md" ] || cp "$dir/summary.md" "release-assets/${name}-summary.md"

            for svg in "$dir"/*.svg; do
              [ -f "$svg" ] || continue
              cp "$svg" "release-assets/${name}-$(basename "$svg")"
            done

            tar -czf "release-assets/${name}-complete.tar.gz" -C "$dir" .
          done

          cp benchmark-summary.md release-assets/benchmark-summary.md
          tar -czf "release-assets/benchmark-results-${GITHUB_RUN_ID}.tar.gz" -C benchmark-release-data .

          cat benchmark-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish benchmark release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="benchmark-run-${GITHUB_RUN_ID}"
          title="C-BuildSystem Benchmarks #${GITHUB_RUN_NUMBER}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "$title" \
              --notes-file benchmark-summary.md
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file benchmark-summary.md \
              release-assets/*
          fi
