name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BENCH_JOBS: 2

jobs:
  linux:
    name: Linux (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04 x86_64 / GCC
            runner: ubuntu-22.04
            cc: gcc
            cxx: g++
          - name: Ubuntu 24.04 x86_64 / GCC
            runner: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: Ubuntu 24.04 x86_64 / Clang
            runner: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: Ubuntu 24.04 arm64 / GCC
            runner: ubuntu-24.04-arm
            cc: gcc
            cxx: g++
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          uname -a
          "$CC" --version | head -1
          "$CXX" --version | head -1
      - name: Build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: make clean all
      - name: Test
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: make test

  macos:
    name: macOS (${{ matrix.name }})
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 15 arm64
            runner: macos-15
          - name: 15 Intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          uname -a
          cc --version | head -1
          c++ --version | head -1
      - name: Build
        run: make clean all
      - name: Test
        run: make test

  distro-smoke:
    name: Distro (${{ matrix.name }})
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13 x86_64
            image: debian:13-slim
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential git ca-certificates python3 cmake
          - name: Alpine 3.22 x86_64 / musl
            image: alpine:3.22
            setup: apk add --no-cache build-base git bash coreutils findutils grep sed python3 cmake
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Build and test in distro
        env:
          IMAGE: ${{ matrix.image }}
          SETUP: ${{ matrix.setup }}
        run: |
          docker run --rm \
            -e SETUP="$SETUP" \
            -v "$PWD:/src" -w /src \
            "$IMAGE" sh -lc 'set -eu; eval "$SETUP"; make clean all; make test'

  sanitizers:
    name: ASan + UBSan
    needs: distro-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify Clang
        run: clang --version
      - name: Build with sanitizers
        env:
          CC: clang
          CFLAGS: -std=c11 -O1 -g -Wall -Wextra -Wpedantic -fsanitize=address,undefined -fno-omit-frame-pointer
        run: make clean all
      - name: Test with sanitizers
        env:
          CC: clang
          CXX: clang++
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: make test

  fuzz-smoke:
    name: Fuzz smoke
    needs: sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify fuzz toolchain
        run: |
          set -eu
          clang --version
          cov="$(command -v llvm-cov || command -v llvm-cov-21 || command -v llvm-cov-20 || command -v llvm-cov-19 || command -v llvm-cov-18 || command -v llvm-cov-17 || true)"
          prof="$(command -v llvm-profdata || command -v llvm-profdata-21 || command -v llvm-profdata-20 || command -v llvm-profdata-19 || command -v llvm-profdata-18 || command -v llvm-profdata-17 || true)"
          if [ -z "$cov" ] || [ -z "$prof" ]; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y llvm
            cov="$(command -v llvm-cov)"
            prof="$(command -v llvm-profdata)"
          fi
          "$cov" --version
          "$prof" --version
      - name: Prepare fuzz harness
        run: cp -R .github/ci/fuzz fuzz
      - name: Build fuzz targets with sanitizers and coverage
        env:
          CC: clang
          FUZZ_COVERAGE: 1
        run: ./fuzz/build.sh
      - name: Fuzz smoke
        env:
          FUZZ_PROFILE_DIR: ${{ github.workspace }}/fuzz/profiles
        run: |
          ./fuzz/run-one.sh lockfile 20
          ./fuzz/run-one.sh depfile 20
          ./fuzz/run-one.sh cache 20
          ./fuzz/run-one.sh cli 20
          ./fuzz/run-one.sh fs 20
          ./fuzz/run-one.sh project 30
      - name: Coverage and regression gates
        env:
          FUZZ_PROFILE_DIR: ${{ github.workspace }}/fuzz/profiles
        run: ./fuzz/coverage-report.sh
      - name: Publish fuzz summary
        if: success() || failure()
        run: |
          if [ -s fuzz/coverage/coverage.md ]; then
            cat fuzz/coverage/coverage.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## Fuzz coverage'
              echo
              echo 'Coverage report was not produced.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload fuzz evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-${{ github.run_id }}
          path: |
            fuzz/coverage/
            fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30

  real-projects:
    name: Real projects
    needs: fuzz-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install BGE system dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev \
            libxinerama-dev libxcursor-dev libxext-dev
      - name: Build C-BuildSystem
        run: make clean all
      - name: Validate pinned real projects
        run: .github/ci/real-projects.sh "$PWD/build/c" "$PWD/include"

  benchmark-cjson:
    name: cJSON benchmark
    needs: real-projects
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Verify tools
        run: |
          ninja --version
          cmake --version
          cc --version | head -1
          git --version
          /usr/bin/time --version | head -1
      - name: Prepare benchmark harness
        run: cp -R .github/ci/benchmarks benchmarks
      - name: Benchmark cJSON
        run: |
          set -o pipefail
          python3 benchmarks/cjson/benchmark.py | tee cjson-benchmark.log
      - name: Render readable benchmark table
        run: |
          mkdir -p benchmark-artifact
          python3 .github/ci/table_svg.py benchmarks/cjson/README.md benchmark-artifact cjson
          cp benchmarks/cjson/results.json benchmark-artifact/results.json
          cp cjson-benchmark.log benchmark-artifact/benchmark.log
      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-cjson
          path: benchmark-artifact/
          if-no-files-found: error
          retention-days: 30

  benchmark-fanout:
    name: libcurl fan-out benchmark
    needs: benchmark-cjson
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Verify tools
        run: |
          ninja --version
          cmake --version
          cc --version | head -1
          git --version
          /usr/bin/time --version | head -1
      - name: Prepare benchmark harness
        run: cp -R .github/ci/benchmarks benchmarks
      - name: Benchmark libcurl header fan-out
        run: |
          set -o pipefail
          python3 benchmarks/fanout/benchmark.py | tee fanout-benchmark.log
      - name: Render readable benchmark table
        run: |
          mkdir -p benchmark-artifact
          python3 .github/ci/table_svg.py benchmarks/fanout/README.md benchmark-artifact fanout
          cp benchmarks/fanout/results.json benchmark-artifact/results.json
          cp fanout-benchmark.log benchmark-artifact/benchmark.log
      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-fanout
          path: benchmark-artifact/
          if-no-files-found: error
          retention-days: 30

  benchmark-sdl3:
    name: SDL3 benchmark
    needs: benchmark-fanout
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Verify tools
        run: |
          ninja --version
          cmake --version
          cc --version | head -1
          git --version
          /usr/bin/time --version | head -1
      - name: Machine
        run: |
          uname -a
          lscpu | sed -n '1,20p'
          cc --version | head -1
          cmake --version | head -1
          ninja --version
      - name: Prepare benchmark harness
        run: cp -R .github/ci/benchmarks benchmarks
      - name: Benchmark and profile SDL3
        run: |
          mkdir -p benchmark-report
          set -o pipefail
          python3 benchmarks/sdl3/benchmark.py | tee benchmark-report/benchmark.log
      - name: Build SDL3 report
        run: |
          python3 benchmarks/sdl3/render_report.py benchmark-report/benchmark.log benchmark-report
          mkdir -p benchmark-artifact
          python3 .github/ci/table_svg.py benchmark-report/summary.md benchmark-artifact sdl3
          cp benchmark-report/results.json benchmark-artifact/results.json
          cp benchmark-report/benchmark.log benchmark-artifact/benchmark.log
          cp benchmark-report/timings.svg benchmark-artifact/sdl3-timings.svg
          cp benchmark-report/resources.svg benchmark-artifact/sdl3-resources.svg
          {
            echo
            echo '## Additional charts'
            echo
            echo '![SDL3 timings](sdl3-timings.svg)'
            echo
            echo '![SDL3 resources](sdl3-resources.svg)'
          } >> benchmark-artifact/summary.md
      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-sdl3
          path: benchmark-artifact/
          if-no-files-found: error
          retention-days: 30

  benchmark-large:
    name: Wireshark benchmark
    needs: benchmark-sdl3
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Wireshark benchmark dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            ninja-build cmake build-essential git time flex bison perl python3 \
            libglib2.0-dev libgcrypt20-dev libc-ares-dev libpcre2-dev
      - name: Prepare benchmark harness
        run: cp -R .github/ci/benchmarks benchmarks
      - name: Benchmark Wireshark dissectors
        run: |
          set -o pipefail
          python3 benchmarks/large/benchmark.py | tee large-benchmark.log
      - name: Render readable benchmark table
        run: |
          mkdir -p benchmark-artifact
          python3 .github/ci/table_svg.py benchmarks/large/README.md benchmark-artifact wireshark
          cp benchmarks/large/results.json benchmark-artifact/results.json
          cp large-benchmark.log benchmark-artifact/benchmark.log
      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-large
          path: benchmark-artifact/
          if-no-files-found: error
          retention-days: 30

  benchmark-release:
    name: Benchmark summary + release
    needs: benchmark-large
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-*
          path: benchmark-release-data
          merge-multiple: false

      - name: Build release bundle and notes
        run: |
          set -euo pipefail
          mkdir -p release-assets

          generated="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          {
            echo '# C-BuildSystem benchmark results'
            echo
            echo 'Manual CI run with the standardized C-BuildSystem validation and benchmark suite.'
            echo
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Workflow run | [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo "| Run ID | \`${GITHUB_RUN_ID}\` |"
            echo "| BENCH_JOBS | \`${BENCH_JOBS}\` |"
            echo "| Generated | ${generated} |"
            echo
            echo 'Validation runs first: Linux → macOS → distro smoke → sanitizers → fuzz smoke → real projects.'
            echo
            echo 'Benchmarks then run sequentially: cJSON → libcurl fan-out → SDL3 → Wireshark.'
            echo
            echo 'Release assets include raw JSON results, benchmark logs, readable Markdown summaries, SVG tables/charts, complete per-benchmark archives, and one combined archive.'
          } > benchmark-summary.md

          for dir in benchmark-release-data/benchmark-*; do
            [ -d "$dir" ] || continue
            name="${dir##*/benchmark-}"

            if [ -s "$dir/summary.md" ]; then
              {
                echo
                echo "## ${name}"
                echo
                cat "$dir/summary.md"
              } >> benchmark-summary.md
            fi

            [ ! -f "$dir/results.json" ] || cp "$dir/results.json" "release-assets/${name}-results.json"
            [ ! -f "$dir/benchmark.log" ] || cp "$dir/benchmark.log" "release-assets/${name}-benchmark.log"
            [ ! -f "$dir/summary.md" ] || cp "$dir/summary.md" "release-assets/${name}-summary.md"

            for svg in "$dir"/*.svg; do
              [ -f "$svg" ] || continue
              cp "$svg" "release-assets/${name}-$(basename "$svg")"
            done

            tar -czf "release-assets/${name}-complete.tar.gz" -C "$dir" .
          done

          cp benchmark-summary.md release-assets/benchmark-summary.md
          tar -czf "release-assets/benchmark-results-${GITHUB_RUN_ID}.tar.gz" -C benchmark-release-data .

          cat benchmark-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish benchmark release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="benchmark-run-${GITHUB_RUN_ID}"
          title="C-BuildSystem Benchmarks #${GITHUB_RUN_NUMBER}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file benchmark-summary.md
            gh release upload "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file benchmark-summary.md \
              release-assets/*
          fi
