name: Native Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - windows-native
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows PowerShell / Clang
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - name: Install GNU Make
        run: choco install make --no-progress -y
      - name: Toolchain
        run: |
          make --version | Select-Object -First 1
          clang --version | Select-Object -First 1
          llvm-ar --version | Select-Object -First 1
          $PSVersionTable.PSVersion
      - name: Default compiler contract
        run: |
          Remove-Item Env:CC -ErrorAction SilentlyContinue
          $database = (& make -pn 2>$null) -join "`n"
          if ($database -notmatch '(?m)^CC = cc$') {
            throw 'Windows Makefile must honor GNU Make default CC=cc instead of forcing clang'
          }
      - name: Native Windows smoke test
        run: .github/ci/windows.ps1

  unix-regression:
    name: ${{ matrix.name }} regression
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC
            runner: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: macOS / Clang
            runner: macos-15
            cc: cc
            cxx: c++
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build and test existing Unix backend
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          make clean all
          make test
