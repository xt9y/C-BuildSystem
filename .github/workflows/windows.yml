name: SDL3 PowerShell validation

on:
  push:
    branches:
      - sdl3-powershell-ci

permissions:
  contents: read

jobs:
  powershell:
    name: Locate PowerShell parse error
    runs-on: windows-2025
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Parse deployed polyglot with diagnostics
        run: |
          $url = 'https://xt9y-29bxyddmk-xt9ys-projects.vercel.app/sdl3'
          $content = Invoke-RestMethod -Uri $url
          Write-Host "Invoke-RestMethod returned: $($content.GetType().FullName)"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput([string]$content, [ref]$tokens, [ref]$errors) | Out-Null
          foreach ($error in $errors) {
            $e = $error.Extent
            Write-Host "PARSE ERROR: $($error.Message)"
            Write-Host "LINE $($e.StartLineNumber), COLUMN $($e.StartColumnNumber): $($e.Text)"
          }
          if ($errors.Count -ne 0) { throw "PowerShell parser found $($errors.Count) error(s)" }
