name: SDL3 PowerShell validation

on:
  push:
    branches:
      - sdl3-powershell-ci

permissions:
  contents: read

jobs:
  powershell:
    name: Reproduce compiler discovery
    runs-on: windows-2025
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Reproduce helper exactly
        run: |
          $shim = Join-Path $PWD 'shim'
          New-Item -ItemType Directory -Force $shim | Out-Null
          foreach ($tool in @('cc', 'c++')) {
            "@echo off`r`nexit /b 0`r`n" | Set-Content -Encoding Ascii (Join-Path $shim "$tool.cmd")
          }
          $env:Path = "$shim;$env:Path"
          $env:CC = 'cc'
          $env:CXX = 'c++'

          function Find-FirstCommand-Buggy {
              param([string[]]$Names)
              foreach ($name in $Names) {
                  Write-Host "buggy candidate='$name' Names='$Names'"
                  if ([string]::IsNullOrWhiteSpace($name)) { continue }
                  $cmd = Get-Command $name -ErrorAction SilentlyContinue
                  if ($cmd) { return $cmd.Source }
              }
              return $null
          }

          function Find-FirstCommand-Fixed {
              param([string[]]$Candidates)
              foreach ($candidate in $Candidates) {
                  Write-Host "fixed candidate='$candidate'"
                  if ([string]::IsNullOrWhiteSpace($candidate)) { continue }
                  $cmd = Get-Command $candidate -ErrorAction SilentlyContinue
                  if ($cmd) { return $cmd.Source }
              }
              return $null
          }

          $cxxCandidates = @($env:CXX, 'c++', 'clang++', 'g++')
          $buggy = Find-FirstCommand-Buggy $cxxCandidates
          $fixed = Find-FirstCommand-Fixed $cxxCandidates
          Write-Host "buggy result='$buggy'"
          Write-Host "fixed result='$fixed'"
          if ($buggy) { throw "Expected buggy helper to fail, but it returned $buggy" }
          if (-not $fixed) { throw 'Fixed helper still failed' }
