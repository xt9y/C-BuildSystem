name: SDL3 production full install

on:
  push:
    branches:
      - sdl3-powershell-ci

permissions:
  contents: read

jobs:
  windows:
    name: Clean native Windows install
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Build and install all SDL dependencies from production endpoint
        run: |
          $prefix = Join-Path $PWD 'real-sdl'
          $build = Join-Path $PWD 'sdl-build'
          Remove-Item -Recurse -Force $prefix, $build -ErrorAction SilentlyContinue

          $env:PREFIX = $prefix
          $env:BUILD = $build
          $env:CC = (Get-Command 'cc' -CommandType Application -ErrorAction Stop).Source
          $env:CXX = (Get-Command 'c++' -CommandType Application -ErrorAction Stop).Source

          Write-Host "CC=$env:CC"
          Write-Host "CXX=$env:CXX"
          Write-Host "PREFIX=$env:PREFIX"

          Invoke-RestMethod -Uri 'https://xt9y.de/sdl3' | Invoke-Expression

          $required = @(
            (Join-Path $prefix 'include\SDL3\SDL.h')
            (Join-Path $prefix 'include\SDL3_image\SDL_image.h')
            (Join-Path $prefix 'include\SDL3_shadercross\SDL_shadercross.h')
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing installed file: $path" }
          }

          $libs = Get-ChildItem (Join-Path $prefix 'lib') -ErrorAction Stop
          if (-not ($libs.Name -match 'SDL3')) { throw 'No SDL3 libraries were installed' }
          if (-not ($libs.Name -match 'SDL3_image')) { throw 'No SDL3_image library was installed' }
          if (-not ($libs.Name -match 'SDL3_shadercross')) { throw 'No SDL3_shadercross library was installed' }

          Write-Host 'Clean native Windows SDL3 install passed.'
