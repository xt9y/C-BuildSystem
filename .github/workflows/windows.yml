name: SDL3 PowerShell validation

on:
  push:
    branches:
      - sdl3-powershell-ci

permissions:
  contents: read

jobs:
  powershell:
    name: Diagnose CXX discovery
    runs-on: windows-2025
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Inspect c++ resolution
        run: |
          $shim = Join-Path $PWD 'shim'
          New-Item -ItemType Directory -Force $shim | Out-Null
          "@echo off`r`nexit /b 0`r`n" | Set-Content -Encoding Ascii (Join-Path $shim 'c++.cmd')
          "@echo off`r`nexit /b 0`r`n" | Set-Content -Encoding Ascii (Join-Path $shim 'g++.cmd')
          $env:Path = "$shim;$env:Path"

          Write-Host "PATHEXT=$env:PATHEXT"
          Write-Host 'Get-Command c++:'
          Get-Command 'c++' -All -ErrorAction SilentlyContinue | Format-List Name,CommandType,Source,Path
          Write-Host 'Get-Command c++.cmd:'
          Get-Command 'c++.cmd' -All -ErrorAction SilentlyContinue | Format-List Name,CommandType,Source,Path
          Write-Host 'Get-Command g++:'
          Get-Command 'g++' -All -ErrorAction SilentlyContinue | Format-List Name,CommandType,Source,Path
          Write-Host 'where.exe c++:'
          & where.exe 'c++' 2>$null
          Write-Host "where c++ exit=$LASTEXITCODE"
          Write-Host 'where.exe g++:'
          & where.exe 'g++' 2>$null
          Write-Host "where g++ exit=$LASTEXITCODE"
