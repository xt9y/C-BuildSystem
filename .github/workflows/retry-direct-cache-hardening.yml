name: Retry direct cache hardening

on:
  push:
    paths:
      - '.github/workflows/retry-direct-cache-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reapply direct-source patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-direct-cache-hardening.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python3 <<'PY'")
          end = next(i for i in range(start + 1, len(workflow)) if workflow[i].strip() == 'PY')
          body = workflow[start + 1:end]
          nonblank = [line for line in body if line.strip()]
          indent = min(len(line) - len(line.lstrip()) for line in nonblank)
          script = '\n'.join(line[indent:] if line.strip() else '' for line in body) + '\n'
          Path('/tmp/apply-cache-hardening.py').write_text(script)
          PY
          python3 /tmp/apply-cache-hardening.py
          rm -f src/dependency_cache_guard.h src/dependency_cache_clean_guard.h

          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/ci/tests/cache_artifact_recovery.sh')
          text = path.read_text()
          needle = "    cat >src/main.c <<'SRC'"
          count = text.count(needle)
          if count != 2:
              raise SystemExit(f'expected 2 source rewrites, found {count}')
          text = text.replace(needle, "    sleep 1\n" + needle)
          path.write_text(text)
          PY

      - name: Build and run regression suite
        shell: bash
        run: |
          make clean
          make -j2
          make test

      - name: Commit hardened core directly to main
        shell: bash
        run: |
          rm -f .github/workflows/apply-direct-cache-hardening.yml \
                .github/workflows/retry-direct-cache-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden cache artifact publication at the source"
          git push origin HEAD:main
